spring:
  application:
    name: store-node
  datasource:
    url: jdbc:postgresql://localhost:5460/storenode
    username: storenode
    password: storenode
    hikari:
      maximum-pool-size: 20
      connection-timeout: 3000
      connection-init-sql: SET lock_timeout = '2s'
  threads:
    virtual:
      enabled: true
  docker:
    compose:
      lifecycle-management: start-only

storenode:
  branch:
    id: 0190f3c0-0000-7000-8000-000000000001
    code: AIR01
    zone-id: Asia/Kolkata
